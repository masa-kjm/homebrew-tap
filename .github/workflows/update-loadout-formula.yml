name: Update Loadout Formula

on:
  repository_dispatch:
    types:
      - loadout-release
  workflow_dispatch:
    inputs:
      version:
        description: loadout release tag to import
        required: true
        type: string

env:
  REPO: masa-kjm/loadout
  FORMULA_PATH: Formula/loadout.rb

permissions:
  contents: write

jobs:
  update:
    name: Update loadout formula
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            VERSION="${{ github.event.client_payload.version }}"
          else
            VERSION="${{ inputs.version }}"
          fi

          test -n "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Fetch release metadata
        shell: bash
        run: |
          curl -fsSL "https://api.github.com/repos/${REPO}/releases/tags/${VERSION}" -o release.json

      - name: Render formula
        shell: bash
        run: |
          asset_digest() {
            jq -r --arg name "$1" '.assets[] | select(.name == $name) | .digest | sub("^sha256:"; "")' release.json
          }

          MAC_ARM_SHA256="$(asset_digest "loadout-${VERSION}-aarch64-apple-darwin.tar.gz")"
          MAC_INTEL_SHA256="$(asset_digest "loadout-${VERSION}-x86_64-apple-darwin.tar.gz")"
          LINUX_ARM_SHA256="$(asset_digest "loadout-${VERSION}-aarch64-unknown-linux-gnu.tar.gz")"
          LINUX_INTEL_SHA256="$(asset_digest "loadout-${VERSION}-x86_64-unknown-linux-gnu.tar.gz")"

          test -n "$MAC_ARM_SHA256"
          test -n "$MAC_INTEL_SHA256"
          test -n "$LINUX_ARM_SHA256"
          test -n "$LINUX_INTEL_SHA256"

          cat > "$FORMULA_PATH" <<EOF
          class Loadout < Formula
            desc "Local environment manager built around explicit desired state"
            homepage "https://github.com/masa-kjm/loadout"
            version "${VERSION#v}"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/masa-kjm/loadout/releases/download/${VERSION}/loadout-${VERSION}-aarch64-apple-darwin.tar.gz"
                sha256 "${MAC_ARM_SHA256}"
              end

              on_intel do
                url "https://github.com/masa-kjm/loadout/releases/download/${VERSION}/loadout-${VERSION}-x86_64-apple-darwin.tar.gz"
                sha256 "${MAC_INTEL_SHA256}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/masa-kjm/loadout/releases/download/${VERSION}/loadout-${VERSION}-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "${LINUX_ARM_SHA256}"
              end

              on_intel do
                url "https://github.com/masa-kjm/loadout/releases/download/${VERSION}/loadout-${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${LINUX_INTEL_SHA256}"
              end
            end

            def install
              bin.install "loadout"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/loadout --version")
            end
          end
          EOF

      - name: Commit and push
        shell: bash
        run: |
          if git diff --quiet -- "$FORMULA_PATH"; then
            echo "Formula already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FORMULA_PATH"
          git commit -m "chore: update loadout formula to ${VERSION}"
          git push origin HEAD:main
